<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Remote Build Utility</title>
  <link rel="stylesheet" href="/src/styles.css" />
</head>
<body>
  <div id="app">
    <div class="toolbar">
      <span class="app-name">remote-build-utility</span>
      <span class="separator">|</span>
      <span class="platform-tag" id="platform-badge">detecting</span>
    </div>

    <div class="section">
      <label class="label" for="folder-path">Workspace</label>
      <div class="input-row">
        <input type="text" id="folder-path" readonly placeholder="No folder selected" />
        <button id="btn-browse">Browse</button>
        <input type="file" id="browser-folder" webkitdirectory directory multiple hidden />
      </div>
    </div>

    <div class="section">
      <div class="action-row">
        <button id="btn-compile" class="primary" disabled>Sync & Compile</button>
        <span class="status-row">
          <span class="status-dot" id="status-dot"></span>
          <span id="status">Ready</span>
        </span>
      </div>
    </div>

    <div class="section">
      <div class="log-header">
        <label class="label">Output</label>
        <button id="btn-clear" class="link-btn">Clear</button>
      </div>
      <textarea id="output" readonly rows="20" placeholder="Build output will appear here"></textarea>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
